[package]
name = "openidea-grep-console"
version = "0.1.0"
edition = "2024"
publish = false
description = "Regular-expression highlighting for OpenIDEA Run and Debug consoles."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "cb087fff487bf573c945310e6c0d20e62f6309a5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
